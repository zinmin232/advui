name: Native screenshots

# TEMPORARY: an experiment on why the emulator dies at Color Picker. Each job
# takes the light screens up to Color Picker in one graphics mode, and keeps
# what the emulator and the host left behind. To be reverted.
on:
  schedule:
    - cron: '17 2 * * *'
  pull_request:
    paths:
      - apps/expo/screenshots/**
      - .github/workflows/native-screenshots.yml
  workflow_dispatch:
    inputs:
      approve:
        description: Approve this run's screenshots without comparing them
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: native-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        gpu: [swiftshader_indirect, swangle_indirect, auto-no-window]
        attempt: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @advui/expo-playground preview:build

      - name: Download Expo Go for the playground's SDK
        run: |
          sdk="$(node -p "require('./apps/expo/node_modules/expo/package.json').version.split('.')[0]").0.0"
          url=$(curl -fsSL https://api.expo.dev/v2/versions/latest | jq -r ".data.sdkVersions[\"$sdk\"].androidClientUrl")
          curl -fsSL -o expo-go.apk "$url"

      - name: Serve the playground
        run: nohup pnpm --filter @advui/expo-playground preview:dev > preview.log 2>&1 &

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Stop after Color Picker, in light mode
        run: |
          sed -i "s/^const screens = allScreens().filter.*/const screens = allScreens().slice(0, 143)/" apps/expo/screenshots/capture.mjs
          sed -i "s/for (const mode of \['light', 'dark'\])/for (const mode of ['light'])/" apps/expo/screenshots/capture.mjs
          grep -nE "allScreens\(\)\.slice|of \['light'\]" apps/expo/screenshots/capture.mjs

      - name: Watch the host
        run: nohup sh -c 'while true; do echo "$(date +%T) $(free -m | sed -n 2p) | $(ps -eo rss,pcpu,comm --sort=-rss | sed -n 2p)"; sleep 5; done' > host.log 2>&1 &

      - name: Take the screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: medium_phone # the default, 320x640, is too small for the script's tall display
          ram-size: 4096M
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install expo-go.apk
            adb shell dumpsys SurfaceFlinger | grep -m1 GLES
            nohup adb logcat -v threadtime > logcat.txt 2>&1 &
            pnpm --filter @advui/expo-playground screenshots

      - name: Keep what the emulator left
        if: ${{ always() }}
        run: |
          mkdir -p emulator-left
          cp -r /tmp/android-*/emu-crash-* emulator-left/ || true
          find /tmp/android-* -type f -newer expo-go.apk > emulator-left/files.txt || true
          sudo dmesg -T > emulator-left/dmesg.txt || true
          cp host.log logcat.txt preview.log emulator-left/ || true
          grep -inE 'out of memory|oom-kill|killed process|segfault|general protection' emulator-left/dmesg.txt || true
          tail -12 host.log || true

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: emulator-left-${{ matrix.gpu }}-${{ matrix.attempt }}
          path: emulator-left
          if-no-files-found: ignore
          retention-days: 3
