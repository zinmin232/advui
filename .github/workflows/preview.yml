name: Deploy phone preview

# Builds the Expo playground as an update that Expo Go can open, and publishes
# it to the Cloudflare Worker behind the docs' QR codes (see apps/expo/README.md).
# Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths:
      - apps/expo/**
      - examples/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/preview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phone-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @advui/expo-playground preview:build
      - run: pnpm --filter @advui/expo-playground preview:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
