packages:
  - apps/*
  - packages/*
  - examples
minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.2'
  - '@vitest/spy@5.0.2'
  - vitest@5.0.2
# Keep React Native tooling aligned with the Expo SDK 57 pins (RN 0.86).
overrides:
  '@react-native/metro-config': 0.86.3
  react-native-worklets: 0.10.1
  # test-renderer 1.3 requires React 19.3; Expo SDK 57 pins React 19.2.
  test-renderer: ~1.2.0
patchedDependencies:
  '@tamagui/toast@2.7.7': patches/@tamagui__toast@2.7.7.patch
